<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jobctl board</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --mute:#5b6570; --line:#d8dde3; --accent:#1f6feb; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --info:#0969da; --onaccent:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#161b22; --fg:#e6edf3; --mute:#8b949e; --line:#30363d; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff; --onaccent:#0b0e13; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; flex-wrap:wrap; gap:.6rem 1rem; align-items:center; padding:.7rem 1rem; background:var(--card); border-bottom:1px solid var(--line); }
h1 { font-size:1.05rem; margin:0 .5rem 0 0; }
main { max-width:1100px; margin:0 auto; padding:1rem; display:grid; gap:1rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; }
.card h2 { font-size:.95rem; margin:0 0 .6rem; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--mute); font-weight:600; font-size:.8rem; }
tr.sel td { background:color-mix(in srgb, var(--accent) 10%, transparent); }
tbody tr { cursor:pointer; }
.chip { display:inline-block; padding:.1rem .5rem; border-radius:999px; border:1px solid var(--line); font-size:.8rem; }
.s-running { color:var(--ok); border-color:var(--ok); } .s-queued, .s-submitted { color:var(--warn); border-color:var(--warn); }
.s-paused, .s-draining { color:var(--info); border-color:var(--info); } .s-done { color:var(--mute); }
.s-stopped, .s-lost { color:var(--bad); border-color:var(--bad); }
.good { color:var(--ok); } .badtxt { color:var(--bad); } .mute { color:var(--mute); }
button { font:inherit; padding:.25rem .7rem; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
button:hover { border-color:var(--accent); } button.danger { color:var(--bad); } button.primary { background:var(--accent); color:var(--onaccent); border-color:var(--accent); }
input, textarea { font:inherit; padding:.3rem .5rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
label { display:grid; gap:.15rem; font-size:.8rem; color:var(--mute); }
.row { display:flex; flex-wrap:wrap; gap:.5rem; align-items:end; }
pre { margin:.4rem 0 0; padding:.5rem .7rem; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:auto; max-height:18rem; white-space:pre-wrap; word-break:break-all; }
ul { list-style:none; margin:0; padding:0; max-height:15rem; overflow:auto; } li { padding:.15rem 0; border-bottom:1px solid var(--line); }
.banner { padding:.5rem 1rem; background:color-mix(in srgb, var(--bad) 15%, var(--card)); border-bottom:1px solid var(--bad); }
[hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>jobctl board</h1>
  <span id="ssh" class="chip">ssh ?</span>
  <span id="chain" class="chip">chain loop ?</span>
  <span id="age" class="mute"></span>
  <button id="startchain" hidden>Start chain loop</button>
  <button id="refresh">Refresh now</button>
</header>
<div id="banner" class="banner" hidden></div>
<main>
  <section class="card" id="tokenbox" hidden>
    <h2>Token</h2>
    <div class="row"><label>Paste the token from the terminal (or the token file)<input id="tokin" size="44" autocomplete="off"></label><button id="toksave" class="primary">Use</button></div>
  </section>
  <section class="card">
    <h2>Jobs <span class="mute" id="count"></span></h2>
    <table><thead><tr><th>Name</th><th>State</th><th>Nodes</th><th>Elapse</th><th>Heartbeat</th><th>Chain</th><th>Latest job</th><th>Tunnel</th></tr></thead><tbody id="jobs"></tbody></table>
    <div id="nojobs" class="mute" hidden>No jobs yet. Use Launch below.</div>
  </section>
  <section class="card" id="detail" hidden>
    <h2>Job <span id="dname"></span></h2>
    <div class="row" id="dactions"></div>
    <pre id="dinfo"></pre>
    <div class="row" style="margin-top:.6rem"><label style="flex:1">Run a command on node 0<input id="cmd" placeholder="hostname" autocomplete="off"></label><button id="runbtn">Run</button></div>
    <pre id="cmdout" hidden></pre>
  </section>
  <section class="card" id="confirmcard" hidden>
    <h2 id="ctitle">Confirm</h2>
    <div id="cmsg"></div>
    <pre id="clines"></pre>
    <div class="row" style="margin-top:.6rem"><button id="cgo" class="primary">Confirm and go</button><button id="ccancel">Cancel</button></div>
  </section>
  <section class="card">
    <h2>Launch</h2>
    <div class="row">
      <label>Name<input id="l_name" size="14"></label>
      <label>Nodes<input id="l_nodes" type="number" min="1" value="1" style="width:6rem"></label>
      <label>Time<input id="l_time" value="01:00:00" size="9"></label>
      <label>Variants (optional)<input id="l_var" size="22" placeholder="24@72:00:00,12@12:00:00"></label>
      <label>Workload script (optional)<input id="l_script" type="file"></label>
    </div>
    <div class="row" style="margin-top:.5rem"><label style="flex:1">Environment, one NAME=value per line (optional)<textarea id="l_env" rows="2"></textarea></label><button id="lprev" class="primary">Preview submit line</button></div>
  </section>
  <section class="card"><h2>Events</h2><ul id="events"></ul></section>
  <section class="card"><h2>Ports <button id="portsbtn" style="margin-left:.5rem">Show</button></h2><div id="ports" hidden></div></section>
</main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
let token = sessionStorage.getItem("jobctl_token") || "";
if (location.hash.startsWith("#token=")) {
  token = decodeURIComponent(location.hash.slice(7));
  sessionStorage.setItem("jobctl_token", token);
  history.replaceState(null, "", location.pathname);
}
let selected = null, pending = null, lastEvent = 0;

async function api(method, path, body) {
  const r = await fetch("/api/v1" + path, { method, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let data = {};
  try { data = await r.json(); } catch (e) { /* not JSON */ }
  if (r.status === 401) $("#tokenbox").hidden = false;
  return { status: r.status, ok: r.ok, data };
}
function age(s) { if (s == null) return "-"; if (s < 90) return s + "s"; if (s < 5400) return Math.round(s / 60) + "m"; return (s / 3600).toFixed(1) + "h"; }
function banner(msg) { $("#banner").hidden = !msg; $("#banner").textContent = msg || ""; }

async function loadJobs() {
  const r = await api("GET", "/jobs");
  if (!r.ok) return;
  const jobs = r.data.jobs;
  $("#count").textContent = "(" + jobs.length + ")";
  $("#nojobs").hidden = jobs.length > 0;
  const body = $("#jobs");
  body.replaceChildren(...jobs.map((j) => h("tr", { class: j.name === selected ? "sel" : "", onclick: () => select(j.name) },
    h("td", {}, j.name), h("td", {}, h("span", { class: "chip s-" + j.state }, j.state)), h("td", {}, j.nodes), h("td", {}, j.elapse),
    h("td", {}, age(j.hb_age)), h("td", {}, j.seq), h("td", {}, j.latest || "-"),
    h("td", { class: j.tunnel_ok === true ? "good" : j.tunnel_ok === false ? "badtxt" : "mute" }, j.tunnel_ok === true ? "up" : j.tunnel_ok === false ? "down" : "-"))));
  if (selected) loadDetail();
}
async function loadServices() {
  const r = await api("GET", "/services");
  if (!r.ok) return;
  const s = r.data;
  const ssh = $("#ssh"); ssh.textContent = "ssh " + (s.ssh_ok === null ? "?" : s.ssh_ok ? "ok" : "down"); ssh.className = "chip " + (s.ssh_ok ? "s-running" : s.ssh_ok === false ? "s-lost" : "");
  const ch = $("#chain"); ch.textContent = "chain loop " + s.chain_loop; ch.className = "chip " + (s.chain_loop === "up" ? "s-running" : s.chain_loop === "down" ? "s-lost" : "");
  $("#startchain").hidden = !(s.chain_loop !== "up" && s.live_jobs > 0);
  $("#age").textContent = s.refresh_age == null ? "not refreshed yet" : "refreshed " + age(s.refresh_age) + " ago";
  banner(s.ssh_ok === false ? "Cannot reach the login node: " + (s.ssh_error || "ssh failed") : s.chain_loop === "down" && s.live_jobs > 0 ? "Jobs are live but no chain loop runs on the login node, so successors will not be queued. Use Start chain loop." : "");
}
function select(name) { selected = name; $("#detail").hidden = false; $("#cmdout").hidden = true; loadJobs(); }
async function loadDetail() {
  const r = await api("GET", "/jobs/" + encodeURIComponent(selected));
  if (!r.ok) { $("#detail").hidden = true; selected = null; return; }
  const j = r.data;
  $("#dname").textContent = j.name + " (" + j.state + ")";
  $("#dinfo").textContent = JSON.stringify({ flags: j.flags, chain_jobs: j.chain_jobs, winner: j.winner, next_request: j.next_req, info: j.info }, null, 1);
  const act = (label, path, cls) => h("button", { class: cls || "", onclick: () => doAction(path, label) }, label);
  const paused = j.flags.indexOf("PAUSE") >= 0;
  $("#dactions").replaceChildren(act("Stop", "stop"), paused ? act("Resume", "resume") : act("Pause", "pause"), act("Drain", "drain"), act("Resubmit", "resubmit"),
    h("button", { class: "danger", onclick: () => preview("/jobs/" + encodeURIComponent(j.name) + "/kill", {}, "Cancel every allocation of " + j.name + "?") }, "Kill"));
}
async function doAction(path, label) {
  const r = await api("POST", "/jobs/" + encodeURIComponent(selected) + "/" + path, {});
  banner(r.ok ? "" : label + " failed: " + (r.data.error || r.status));
  loadJobs(); loadEvents();
}
async function preview(path, body, title) {
  const r = await api("POST", path, body);
  if (!r.ok) { banner((r.data.error || "request failed") + (r.data.output ? "\n" + r.data.output : "")); return; }
  banner("");
  pending = { path, body, code: r.data.confirm };
  $("#ctitle").textContent = title;
  $("#cmsg").textContent = "Code " + r.data.confirm + " is valid for " + Math.round(r.data.expires_in / 60) + " minutes and works once.";
  $("#clines").textContent = (r.data.submit || r.data.would_cancel.map((x) => "cancel job " + x)).join("\n");
  $("#cgo").hidden = false; $("#ccancel").textContent = "Cancel";
  $("#confirmcard").hidden = false;
  $("#confirmcard").scrollIntoView({ block: "nearest" });
}
$("#cgo").onclick = async () => {
  if (!pending) return;
  const r = await api("POST", pending.path, Object.assign({}, pending.body, { confirm: pending.code }));
  banner(r.ok ? "" : (r.data.error || "failed") + (r.data.output ? "\n" + r.data.output : ""));
  if (r.ok) { $("#cmsg").textContent = (r.data.output || "done").trim(); $("#clines").textContent = ""; $("#cgo").hidden = true; $("#ccancel").textContent = "Close"; pending = null; }
  loadJobs(); loadEvents();
};
$("#ccancel").onclick = () => { pending = null; $("#confirmcard").hidden = true; };
$("#lprev").onclick = async () => {
  const body = { name: $("#l_name").value.trim(), nodes: parseInt($("#l_nodes").value, 10) || 1, time: $("#l_time").value.trim() };
  if ($("#l_var").value.trim()) body.variants = $("#l_var").value.trim();
  const env = {};
  for (const line of $("#l_env").value.split("\n")) { const i = line.indexOf("="); if (i > 0) env[line.slice(0, i).trim()] = line.slice(i + 1); }
  if (Object.keys(env).length) body.env = env;
  const f = $("#l_script").files[0];
  if (f) body.script = await f.text();
  preview("/jobs", body, "Submit " + body.name + "?");
};
$("#runbtn").onclick = async () => {
  const cmd = $("#cmd").value;
  if (!cmd.trim() || !selected) return;
  const out = $("#cmdout"); out.hidden = false; out.textContent = "running...";
  const r = await api("POST", "/jobs/" + encodeURIComponent(selected) + "/run", { command: cmd });
  out.textContent = (r.data.output || "") + (r.data.error ? "\n[" + r.data.error + "]" : "") + (r.ok ? "\n[exit " + r.data.rc + "]" : "\n[" + (r.data.error || r.status) + "]");
};
$("#cmd").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#runbtn").click(); });
$("#refresh").onclick = async () => { $("#refresh").disabled = true; await api("POST", "/refresh", {}); $("#refresh").disabled = false; loadAll(); };
$("#startchain").onclick = async () => { const r = await api("POST", "/services/chain-start", {}); banner(r.ok ? "" : "Could not start: " + (r.data.error || r.status)); loadServices(); };
$("#toksave").onclick = () => { token = $("#tokin").value.trim(); sessionStorage.setItem("jobctl_token", token); $("#tokenbox").hidden = true; loadAll(); startStream(); };
$("#portsbtn").onclick = async () => {
  const box = $("#ports");
  if (!box.hidden) { box.hidden = true; $("#portsbtn").textContent = "Show"; return; }
  const r = await api("GET", "/ports");
  if (!r.ok) return;
  box.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ["Name", "Kind", "Local", "Frontend", "State", "Check"].map((t) => h("th", {}, t)))),
    h("tbody", {}, r.data.ports.map((p) => h("tr", {}, h("td", {}, p.name), h("td", {}, p.kind), h("td", {}, p.local || "-"), h("td", {}, p.frontend || "-"), h("td", {}, p.state || "-"),
      h("td", { class: p.conflict ? "badtxt" : "good" }, p.conflict || "ok"))))));
  box.hidden = false; $("#portsbtn").textContent = "Hide";
};

function evLine(e) {
  const d = e.data || {};
  const what = e.type === "job.state" ? d.from + " -> " + d.to : e.type === "job.flag" ? d.flag + (d.on ? " set" : " cleared") : e.type === "job.successor" ? "next allocation queued (seq " + d.seq + ")" : d.message || "";
  return h("li", {}, h("span", { class: "mute" }, new Date(e.ts * 1000).toLocaleTimeString() + " "), h("b", {}, (e.job || "service") + " "), e.type + (what ? "  " + what : ""));
}
function addEvent(e) {
  if (e.id <= lastEvent) return;
  lastEvent = e.id;
  const ul = $("#events"); ul.prepend(evLine(e));
  while (ul.children.length > 100) ul.lastChild.remove();
}
async function loadEvents() {
  const r = await api("GET", "/events?since=" + lastEvent);
  if (r.ok) r.data.events.forEach(addEvent);
}
let streaming = false;
async function startStream() {
  if (streaming || !token) return;
  streaming = true;
  try {
    const r = await fetch("/api/v1/stream", { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) { if (r.status === 401) $("#tokenbox").hidden = false; return; }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = block.split("\n").find((l) => l.startsWith("data: "));
        if (line) { try { addEvent(JSON.parse(line.slice(6))); loadJobs(); loadServices(); } catch (e) { /* ignore */ } }
      }
    }
  } catch (e) { /* reconnect below */ }
  streaming = false;
  setTimeout(startStream, 3000);
}
function loadAll() { loadJobs(); loadServices(); }
if (!token) $("#tokenbox").hidden = false;
loadAll(); loadEvents(); startStream();
setInterval(loadAll, 5000);
</script>
</body>
</html>
